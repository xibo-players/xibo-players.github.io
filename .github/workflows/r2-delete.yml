name: Delete file from R2

# One-off utility to delete a file from R2.
# Usage:
#   gh workflow run r2-delete.yml -f path=deb/debian/trixie/amd64/xiboplayer-electron_0.2.0-1_amd64.deb

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path within the R2 bucket to delete (e.g. deb/debian/trixie/amd64/foo.deb)'
        required: true
        type: string
      dry-run:
        description: 'Dry run — only list, do not delete'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Install awscli
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y awscli

      - name: Delete file from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PATH_TO_DELETE: ${{ inputs.path }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          BUCKET="${R2_BUCKET}"
          FULL="${BUCKET}/${PATH_TO_DELETE}"
          echo "Target: $FULL"

          # Verify it exists
          if ! aws s3 ls "$FULL" --endpoint-url "$R2_ENDPOINT" 2>/dev/null | grep -q .; then
            echo "ERROR: Path not found: $FULL"
            exit 1
          fi

          aws s3 ls "$FULL" --endpoint-url "$R2_ENDPOINT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY-RUN] Would delete: $FULL"
            exit 0
          fi

          aws s3 rm "$FULL" --endpoint-url "$R2_ENDPOINT"
          echo "Deleted: $FULL"
