name: Update Package Repositories

# Centralized workflow that regenerates RPM + DEB repository metadata
# from GitHub Release assets across all xibo-players repos.
#
# Triggered by repository_dispatch from build-rpm.yml / build-deb.yml
# after they create a GitHub Release. Can also be run manually.
#
# Uses a concurrency group to serialize updates — if multiple repos
# trigger simultaneously, intermediate runs are auto-cancelled and
# only the latest pending run executes (which regenerates everything
# from scratch, so no data is lost).
#
# RPMs:  only metadata stored here (repodata XML); dnf downloads
#        actual RPMs from GitHub Releases via baseurl.
# DEBs:  actual .deb files copied here (apt requires them at the
#        same URL as Packages). Files >95MB are skipped (GitHub's
#        100MB limit). Those packages are available via GitHub
#        Releases for manual install (gh release download + dpkg -i).
# Images: stored in GitHub Releases only; linked from pages.

on:
  repository_dispatch:
    types: [update-repos]
  push:
    branches: [main]
    paths:
      - 'rpm/**/*.rpm'
      - 'deb/**/*.deb'
      - '_repos/**'
  workflow_dispatch:

concurrency:
  group: update-repos
  cancel-in-progress: true

permissions:
  contents: write

env:
  FEDORA_VERS: '43 44'
  UBUNTU_VER: '24.04'
  DEBIAN_VER: 'trixie'
  # Skip .deb files larger than this (MB) — GitHub rejects >100MB
  FILE_SIZE_LIMIT_MB: '95'

jobs:
  update:
    name: Regenerate RPM + DEB repositories
    runs-on: ubuntu-latest
    container:
      # Must match FEDORA_VER above (env context not allowed in container.image)
      image: fedora:43

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      # git must be installed BEFORE checkout, otherwise checkout falls
      # back to tarball extraction (no .git dir → can't commit/push)
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install tools
        run: dnf install -y createrepo_c dpkg dpkg-dev curl jq gnupg2

      - name: Download release assets from all repos
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPOS=(
            "xibo-players/xiboplayer-chromium"
            "xibo-players/xiboplayer-electron"
            "xibo-players/xiboplayer-kiosk"
            "xibo-players/arexibo"
            "xibo-players/xibo-players.github.io"
          )

          for repo in "${REPOS[@]}"; do
            pkg=$(basename "$repo")
            echo "::group::$pkg"
            mkdir -p /tmp/assets/$pkg

            # Get latest non-draft release
            release=$(curl -sfH "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/latest" 2>/dev/null || echo '{}')

            tag=$(echo "$release" | jq -r '.tag_name // empty')
            if [ -z "$tag" ]; then
              echo "No release found, skipping"
              echo "::endgroup::"
              continue
            fi
            echo "Release: $tag"
            echo "$tag" > /tmp/assets/$pkg/.tag
            echo "$repo" > /tmp/assets/$pkg/.repo

            # Download all assets
            echo "$release" | jq -r '.assets[] | "\(.name)\t\(.size)\t\(.browser_download_url)"' | \
            while IFS=$'\t' read -r name size url; do
              size_mb=$((size / 1048576))
              echo "  ${name} (${size_mb}MB)"
              curl -sL -o "/tmp/assets/$pkg/$name" "$url"
            done
            echo "::endgroup::"
          done

      # ── RPM: generate repodata with baseurl → GitHub Releases ──────
      - name: Generate per-repo RPM repodata
        run: |
          KNOWN_FC_TAGS=()
          for v in $FEDORA_VERS; do
            KNOWN_FC_TAGS+=("fc${v}")
          done

          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")
            [ -f "$pkg_dir/.tag" ] || continue
            tag=$(cat "$pkg_dir/.tag")
            repo=$(cat "$pkg_dir/.repo")
            baseurl="https://github.com/$repo/releases/download/$tag"

            # Check if this repo has RPMs
            shopt -s nullglob
            rpms=("$pkg_dir"*.rpm)
            shopt -u nullglob
            [ ${#rpms[@]} -gt 0 ] || continue

            echo "::group::RPM: $pkg (baseurl: $baseurl)"

            # Create temp dirs per Fedora version and arch
            for v in $FEDORA_VERS; do
              for arch in x86_64 aarch64 noarch SRPMS; do
                mkdir -p /tmp/rpm-repo/$pkg/$v/$arch
              done
            done

            for rpm in "${rpms[@]}"; do
              name=$(basename "$rpm")
              # Skip GPG key files
              [[ "$name" == RPM-GPG-KEY-* ]] && continue

              # Parse Fedora tag from filename prefix (format: fcVER.originalname.rpm)
              fc_ver=""
              clean_name="$name"
              for fctag in "${KNOWN_FC_TAGS[@]}"; do
                if [[ "$name" == "${fctag}."* ]]; then
                  fc_ver="${fctag#fc}"
                  clean_name="${name#${fctag}.}"
                  break
                fi
              done

              # Unprefixed RPMs default to first Fedora version (legacy compatibility)
              if [ -z "$fc_ver" ]; then
                fc_ver="${FEDORA_VERS%% *}"
                clean_name="$name"
              fi

              # Distribute by arch
              if [[ "$clean_name" == *.src.rpm ]]; then
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/SRPMS/$clean_name"
                echo "  [fc${fc_ver}] SRPMS: $clean_name"
              elif [[ "$clean_name" == *.x86_64.rpm ]]; then
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/x86_64/$clean_name"
                echo "  [fc${fc_ver}] x86_64: $clean_name"
              elif [[ "$clean_name" == *.aarch64.rpm ]]; then
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/aarch64/$clean_name"
                echo "  [fc${fc_ver}] aarch64: $clean_name"
              elif [[ "$clean_name" == *.noarch.rpm ]]; then
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/x86_64/$clean_name"
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/aarch64/$clean_name"
                cp "$rpm" "/tmp/rpm-repo/$pkg/$fc_ver/noarch/$clean_name"
                echo "  [fc${fc_ver}] noarch: $clean_name"
              fi
            done

            # Generate repodata per (Fedora version, arch)
            for v in $FEDORA_VERS; do
              for arch in x86_64 aarch64 noarch SRPMS; do
                if ls /tmp/rpm-repo/$pkg/$v/$arch/*.rpm &>/dev/null 2>&1; then
                  echo "  createrepo_c fc${v}/$arch"
                  createrepo_c --baseurl "$baseurl" /tmp/rpm-repo/$pkg/$v/$arch/
                fi
              done

              # Save repodata to _repos structure
              for arch in x86_64 aarch64 noarch SRPMS; do
                target="_repos/$pkg/rpm/fedora/${v}/$arch"
                rm -rf "$target"
                if [ -d "/tmp/rpm-repo/$pkg/$v/$arch/repodata" ]; then
                  mkdir -p "$target"
                  cp -r /tmp/rpm-repo/$pkg/$v/$arch/repodata "$target/"
                fi
              done
            done

            # Copy GPG public key
            if ls "$pkg_dir"RPM-GPG-KEY-* &>/dev/null; then
              mkdir -p rpm
              cp "$pkg_dir"RPM-GPG-KEY-* rpm/
            fi

            echo "::endgroup::"
          done

      - name: Merge RPM repos into unified index
        run: |
          WORKDIR="$(pwd)"

          for v in $FEDORA_VERS; do
            echo "Merging Fedora $v repos..."
            for arch in x86_64 aarch64 noarch SRPMS; do
              output="rpm/fedora/${v}/$arch"
              mkdir -p "$output"

              # Collect all per-repo repodata dirs for this arch
              repos=()
              for repo_dir in _repos/*/rpm/fedora/${v}/$arch; do
                if [ -d "$repo_dir/repodata" ]; then
                  repos+=("--repo" "${WORKDIR}/$repo_dir")
                fi
              done

              repo_count=$(( ${#repos[@]} / 2 ))
              if [ $repo_count -gt 0 ]; then
                echo "  Merging $arch: $repo_count repo(s)"
                rm -rf "$output/repodata"
                mergerepo_c "${repos[@]}" -o "${WORKDIR}/$output"
              fi
            done
          done

          echo "RPM repodata files:"
          find rpm/fedora/ -name 'repomd.xml' 2>/dev/null

      # ── DEB: download .deb files + regenerate Packages index ────────
      # apt requires actual .deb files at the URL referenced by Packages.
      # Since GitHub Pages serves from this repo, small DEBs are stored here.
      # Files >95MB are skipped (GitHub's 100MB git file limit).
      - name: Update DEB repository
        run: |
          # Distro tag → repo path and codename mappings
          declare -A DISTRO_PATH=(
            ["ubuntu2404"]="deb/ubuntu/${UBUNTU_VER}"
            ["debiantrixie"]="deb/debian/${DEBIAN_VER}"
          )
          declare -A DISTRO_CODENAME=(
            ["ubuntu2404"]="noble"
            ["debiantrixie"]="trixie"
          )
          KNOWN_TAGS=("ubuntu2404" "debiantrixie")

          SIZE_LIMIT=$((FILE_SIZE_LIMIT_MB * 1048576))

          # Create directory structure for all distros
          for tag in "${KNOWN_TAGS[@]}"; do
            base="${DISTRO_PATH[$tag]}"
            for arch in amd64 arm64 all; do
              mkdir -p "$base/$arch"
            done
            # Remove old .deb files (will re-download current versions from releases)
            find "$base" -name '*.deb' -delete
          done

          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")
            [ -f "$pkg_dir/.tag" ] || continue

            shopt -s nullglob
            debs=("$pkg_dir"*.deb)
            shopt -u nullglob
            [ ${#debs[@]} -gt 0 ] || continue

            echo "::group::DEB: $pkg"

            for deb in "${debs[@]}"; do
              name=$(basename "$deb")
              size=$(stat -c%s "$deb")
              size_mb=$((size / 1048576))

              if [ "$size" -gt "$SIZE_LIMIT" ]; then
                echo "  SKIP $name (${size_mb}MB > ${FILE_SIZE_LIMIT_MB}MB — install from GitHub Releases)"
                continue
              fi

              # Parse distro tag from filename prefix (format: TAG.originalname.deb)
              distro_tag=""
              clean_name="$name"
              for tag in "${KNOWN_TAGS[@]}"; do
                if [[ "$name" == "${tag}."* ]]; then
                  distro_tag="$tag"
                  clean_name="${name#${tag}.}"
                  break
                fi
              done

              # Unprefixed DEBs default to ubuntu2404 (legacy compatibility)
              if [ -z "$distro_tag" ]; then
                distro_tag="ubuntu2404"
                clean_name="$name"
              fi

              REPO_BASE="${DISTRO_PATH[$distro_tag]}"

              # Detect architecture
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "unknown")
              case "$arch" in
                amd64) cp "$deb" "$REPO_BASE/amd64/$clean_name"; echo "  [$distro_tag] amd64: $clean_name (${size_mb}MB)" ;;
                arm64) cp "$deb" "$REPO_BASE/arm64/$clean_name"; echo "  [$distro_tag] arm64: $clean_name (${size_mb}MB)" ;;
                all)
                  cp "$deb" "$REPO_BASE/amd64/$clean_name"
                  cp "$deb" "$REPO_BASE/arm64/$clean_name"
                  cp "$deb" "$REPO_BASE/all/$clean_name"
                  echo "  [$distro_tag] all: $clean_name (${size_mb}MB)"
                  ;;
                *) echo "  SKIP $name (unknown arch: $arch)" ;;
              esac
            done

            # Copy GPG public key
            if ls "$pkg_dir"DEB-GPG-KEY-* &>/dev/null; then
              cp "$pkg_dir"DEB-GPG-KEY-* deb/
            fi

            echo "::endgroup::"
          done

          # Handle source DEB files (.dsc, .orig.tar.*, .debian.tar.*)
          for tag in "${KNOWN_TAGS[@]}"; do
            base="${DISTRO_PATH[$tag]}"
            mkdir -p "$base/source"
            rm -f "$base/source"/*.dsc "$base/source"/*.tar.*
          done

          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")
            [ -f "$pkg_dir/.tag" ] || continue

            shopt -s nullglob
            src_files=("$pkg_dir"*.dsc "$pkg_dir"*.orig.tar.* "$pkg_dir"*.debian.tar.*)
            shopt -u nullglob
            [ ${#src_files[@]} -gt 0 ] || continue

            echo "::group::DEB source: $pkg"
            for src_file in "${src_files[@]}"; do
              name=$(basename "$src_file")
              size=$(stat -c%s "$src_file")
              size_mb=$((size / 1048576))

              if [ "$size" -gt "$SIZE_LIMIT" ]; then
                echo "  SKIP $name (${size_mb}MB > ${FILE_SIZE_LIMIT_MB}MB)"
                continue
              fi

              # Parse distro tag from filename prefix
              distro_tag=""
              clean_name="$name"
              for tag in "${KNOWN_TAGS[@]}"; do
                if [[ "$name" == "${tag}."* ]]; then
                  distro_tag="$tag"
                  clean_name="${name#${tag}.}"
                  break
                fi
              done
              if [ -z "$distro_tag" ]; then
                distro_tag="ubuntu2404"
                clean_name="$name"
              fi

              REPO_BASE="${DISTRO_PATH[$distro_tag]}"
              cp "$src_file" "$REPO_BASE/source/$clean_name"
              echo "  [$distro_tag] source: $clean_name (${size_mb}MB)"
            done
            echo "::endgroup::"
          done

          # Rebuild APT indices for each distro
          echo "Rebuilding APT indices..."
          for tag in "${KNOWN_TAGS[@]}"; do
            REPO_BASE="${DISTRO_PATH[$tag]}"
            codename="${DISTRO_CODENAME[$tag]}"
            echo "  Distro: $tag ($codename)"

            for arch in amd64 arm64 all; do
              arch_dir="$REPO_BASE/$arch"
              shopt -s nullglob
              deb_files=("$arch_dir"/*.deb)
              shopt -u nullglob
              if [ ${#deb_files[@]} -gt 0 ]; then
                echo "    $arch: ${#deb_files[@]} packages"
                (cd "$arch_dir" && dpkg-scanpackages . /dev/null > Packages && gzip -9c Packages > Packages.gz)
              else
                rm -f "$arch_dir/Packages" "$arch_dir/Packages.gz"
              fi
            done

            # Rebuild Sources index
            src_dir="$REPO_BASE/source"
            shopt -s nullglob
            dsc_files=("$src_dir"/*.dsc)
            shopt -u nullglob
            if [ ${#dsc_files[@]} -gt 0 ]; then
              echo "    source: ${#dsc_files[@]} source packages"
              (cd "$src_dir" && dpkg-scansources . /dev/null > Sources && gzip -9c Sources > Sources.gz)
            else
              rm -f "$src_dir/Sources" "$src_dir/Sources.gz"
            fi

            # Generate Release file with checksums
            (
              cd "$REPO_BASE"
              {
                echo "Origin: xibo-players"
                echo "Label: Xibo Players"
                echo "Suite: stable"
                echo "Codename: $codename"
                echo "Architectures: amd64 arm64 all"
                echo "Components: main"
                echo "Date: $(date -Ru)"
                echo "MD5Sum:"
                for f in */Packages */Packages.gz source/Sources source/Sources.gz; do
                  [ -f "$f" ] || continue
                  echo " $(md5sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
                done
                echo "SHA1:"
                for f in */Packages */Packages.gz source/Sources source/Sources.gz; do
                  [ -f "$f" ] || continue
                  echo " $(sha1sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
                done
                echo "SHA256:"
                for f in */Packages */Packages.gz source/Sources source/Sources.gz; do
                  [ -f "$f" ] || continue
                  echo " $(sha256sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
                done
              } > Release
            )
          done

      - name: GPG-sign DEB Release files
        if: env.DEB_GPG_KEY != ''
        env:
          DEB_GPG_KEY: ${{ secrets.DEB_GPG_KEY }}
          DEB_GPG_PASSPHRASE: ${{ secrets.DEB_GPG_PASSPHRASE }}
        run: |
          # Configure GPG for non-interactive signing
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "${DEB_GPG_PASSPHRASE:-}" > /tmp/gpg-passphrase
          chmod 600 /tmp/gpg-passphrase
          echo "batch" > ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "passphrase-file /tmp/gpg-passphrase" >> ~/.gnupg/gpg.conf

          echo "$DEB_GPG_KEY" | base64 -d | gpg --batch --pinentry-mode loopback \
            --passphrase "${DEB_GPG_PASSPHRASE}" --import

          # Sign Release files for all distros
          for RELEASE_FILE in "deb/ubuntu/${UBUNTU_VER}/Release" "deb/debian/${DEBIAN_VER}/Release"; do
            if [ ! -f "$RELEASE_FILE" ]; then
              echo "No Release file at $RELEASE_FILE, skipping"
              continue
            fi

            rm -f "${RELEASE_FILE}.gpg" "$(dirname ${RELEASE_FILE})/InRelease"
            gpg --armor --detach-sign --output "${RELEASE_FILE}.gpg" "${RELEASE_FILE}"
            gpg --armor --clearsign --output "$(dirname ${RELEASE_FILE})/InRelease" "${RELEASE_FILE}"
            echo "Signed: $RELEASE_FILE"
          done

          rm -f /tmp/gpg-passphrase

      # ── Commit and push ─────────────────────────────────────────────
      - name: Push changes
        run: |
          cd "$GITHUB_WORKSPACE"
          # actions/checkout sets safe.directory with a temp HOME that
          # subsequent steps don't inherit — re-add it for our git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only stage repo metadata — never touch site HTML/CSS/JS
          git add rpm/ deb/ _repos/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Build informative commit message
          TRIGGER="${{ github.event.client_payload.package || 'manual' }}"
          git commit -m "Update repositories (trigger: ${TRIGGER})"

          # Retry push — each run regenerates everything from scratch,
          # so on conflict we pull, re-commit our staged files, and push.
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing onto remote..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push failed after 3 attempts"
          exit 1
