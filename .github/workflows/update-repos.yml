name: Update Package Repositories

# Centralized workflow that regenerates RPM + DEB repository metadata
# from packages stored on Cloudflare R2.
#
# Triggered by repository_dispatch from build-rpm.yml / build-deb.yml
# after they upload signed packages to R2. Can also be run manually.
#
# Uses a concurrency group to serialize updates — if multiple repos
# trigger simultaneously, intermediate runs are auto-cancelled and
# only the latest pending run executes (which regenerates everything
# from scratch, so no data is lost).
#
# RPMs: stored inline alongside repodata on R2 — dnf downloads
#       directly from dl.xiboplayer.org.
# DEBs: stored inline alongside Packages/Release on R2 — apt
#       downloads directly from dl.xiboplayer.org.

on:
  repository_dispatch:
    types: [update-repos]
  workflow_dispatch:

concurrency:
  group: update-repos
  cancel-in-progress: false

permissions:
  contents: read

env:
  FEDORA_VERS: '43 44'
  UBUNTU_VER: '24.04'
  DEBIAN_VER: 'trixie'

jobs:
  update:
    name: Regenerate RPM + DEB repositories
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: dnf install -y createrepo_c dpkg dpkg-dev curl jq gnupg2 awscli2

      - name: Download packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${R2_BUCKET:-s3://xiboplayer-images}"
          # Package name → GitHub repo mapping (for GH Release fallback)
          declare -A PKG_REPOS=(
            ["xiboplayer-chromium"]="xibo-players/xiboplayer-chromium"
            ["xiboplayer-electron"]="xibo-players/xiboplayer-electron"
            ["xiboplayer-kiosk"]="xibo-players/xiboplayer-kiosk"
            ["arexibo"]="xibo-players/arexibo"
            ["xibo-players.github.io"]="xibo-players/xibo-players.github.io"
          )

          mkdir -p /tmp/assets
          for pkg in "${!PKG_REPOS[@]}"; do
            echo "::group::$pkg"
            mkdir -p /tmp/assets/$pkg

            # Primary: download from R2 staging (rpm/ and deb/ subdirs)
            # Download from R2 staging (rpm/ and deb/ subdirs)
            for subdir in rpm deb; do
              if aws s3 ls "$BUCKET/packages/$pkg/$subdir/" --endpoint-url "$R2_ENDPOINT" &>/dev/null; then
                aws s3 sync "$BUCKET/packages/$pkg/$subdir/" "/tmp/assets/$pkg/" \
                  --endpoint-url "$R2_ENDPOINT" --no-progress
              fi
            done
            file_count=$(ls /tmp/assets/$pkg/ 2>/dev/null | wc -l)
            if [ "$file_count" -gt 0 ]; then
              echo "Downloaded from R2: $file_count files"
            else
              echo "No packages found on R2, skipping"
            fi
            echo "::endgroup::"
          done

      # ── RPM: sort packages and generate repodata ─────────────────────
      - name: Build RPM repository
        run: |
          KNOWN_FC_TAGS=()
          for v in $FEDORA_VERS; do
            KNOWN_FC_TAGS+=("fc${v}")
          done

          # Create directory structure
          for v in $FEDORA_VERS; do
            for arch in x86_64 aarch64 noarch SRPMS; do
              mkdir -p rpm/fedora/${v}/$arch
            done
          done

          # Sort RPMs from all packages into per-version/arch directories
          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")

            shopt -s nullglob
            rpms=("$pkg_dir"*.rpm)
            shopt -u nullglob
            [ ${#rpms[@]} -gt 0 ] || continue

            echo "::group::RPM: $pkg"

            for rpm in "${rpms[@]}"; do
              name=$(basename "$rpm")
              # Skip GPG key files
              [[ "$name" == RPM-GPG-KEY-* ]] && continue

              # Parse Fedora tag from filename prefix (format: fcVER.originalname.rpm)
              fc_ver=""
              clean_name="$name"
              for fctag in "${KNOWN_FC_TAGS[@]}"; do
                if [[ "$name" == "${fctag}."* ]]; then
                  fc_ver="${fctag#fc}"
                  clean_name="${name#${fctag}.}"
                  break
                fi
              done

              # Unprefixed RPMs default to first Fedora version
              if [ -z "$fc_ver" ]; then
                fc_ver="${FEDORA_VERS%% *}"
                clean_name="$name"
              fi

              # Distribute by arch
              if [[ "$clean_name" == *.src.rpm ]]; then
                cp "$rpm" "rpm/fedora/$fc_ver/SRPMS/$clean_name"
                echo "  [fc${fc_ver}] SRPMS: $clean_name"
              elif [[ "$clean_name" == *.x86_64.rpm ]]; then
                cp "$rpm" "rpm/fedora/$fc_ver/x86_64/$clean_name"
                echo "  [fc${fc_ver}] x86_64: $clean_name"
              elif [[ "$clean_name" == *.aarch64.rpm ]]; then
                cp "$rpm" "rpm/fedora/$fc_ver/aarch64/$clean_name"
                echo "  [fc${fc_ver}] aarch64: $clean_name"
              elif [[ "$clean_name" == *.noarch.rpm ]]; then
                cp "$rpm" "rpm/fedora/$fc_ver/x86_64/$clean_name"
                cp "$rpm" "rpm/fedora/$fc_ver/aarch64/$clean_name"
                cp "$rpm" "rpm/fedora/$fc_ver/noarch/$clean_name"
                echo "  [fc${fc_ver}] noarch: $clean_name"
              fi
            done

            echo "::endgroup::"
          done

          # Generate repodata — RPMs are inline, no baseurl needed
          for v in $FEDORA_VERS; do
            for arch in x86_64 aarch64 noarch SRPMS; do
              dir="rpm/fedora/${v}/$arch"
              if ls $dir/*.rpm &>/dev/null 2>&1; then
                echo "createrepo_c $dir ($(ls $dir/*.rpm | wc -l) packages)"
                createrepo_c "$dir"
              fi
            done
          done

      - name: Generate RPM packages.json index
        run: |
          # Build a JSON index of all RPMs for the website package browser
          echo '[' > rpm/packages.json
          first=true
          for v in $FEDORA_VERS; do
            for arch in x86_64 aarch64 noarch; do
              dir="rpm/fedora/${v}/$arch"
              for rpm in $dir/*.rpm; do
                [ -f "$rpm" ] || continue
                [[ "$rpm" == *.src.rpm ]] && continue
                name=$(rpm -qp --qf '%{NAME}' "$rpm" 2>/dev/null || basename "$rpm" | sed 's/-[0-9].*//')
                ver=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm" 2>/dev/null || echo "?")
                rpmarch=$(rpm -qp --qf '%{ARCH}' "$rpm" 2>/dev/null || echo "$arch")
                size=$(stat -c%s "$rpm")
                file=$(basename "$rpm")
                url="https://dl.xiboplayer.org/$dir/$file"
                [ "$first" = true ] && first=false || echo ',' >> rpm/packages.json
                printf '{"name":"%s","version":"%s","arch":"%s","fedora":"%s","size":%d,"file":"%s","url":"%s"}' \
                  "$name" "$ver" "$rpmarch" "$v" "$size" "$file" "$url" >> rpm/packages.json
              done
            done
          done
          echo ']' >> rpm/packages.json
          echo "RPM index: $(grep -c '"name"' rpm/packages.json) packages"

      # ── DEB: sort packages and generate APT indices ──────────────────
      - name: Build DEB repository
        run: |
          declare -A DISTRO_PATH=(
            ["ubuntu2404"]="deb/ubuntu/${UBUNTU_VER}"
            ["debiantrixie"]="deb/debian/${DEBIAN_VER}"
          )
          declare -A DISTRO_CODENAME=(
            ["ubuntu2404"]="noble"
            ["debiantrixie"]="trixie"
          )
          KNOWN_TAGS=("ubuntu2404" "debiantrixie")

          # Create directory structure
          for tag in "${KNOWN_TAGS[@]}"; do
            base="${DISTRO_PATH[$tag]}"
            for arch in amd64 arm64 all; do
              mkdir -p "$base/$arch"
            done
          done

          # Sort DEBs from all packages
          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")

            shopt -s nullglob
            debs=("$pkg_dir"*.deb)
            shopt -u nullglob
            [ ${#debs[@]} -gt 0 ] || continue

            echo "::group::DEB: $pkg"

            for deb in "${debs[@]}"; do
              name=$(basename "$deb")

              # Parse distro tag from filename prefix (format: TAG.originalname.deb)
              distro_tag=""
              clean_name="$name"
              for tag in "${KNOWN_TAGS[@]}"; do
                if [[ "$name" == "${tag}."* ]]; then
                  distro_tag="$tag"
                  clean_name="${name#${tag}.}"
                  break
                fi
              done

              # Unprefixed DEBs go to ALL distros
              if [ -z "$distro_tag" ]; then
                clean_name="$name"
                arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "unknown")
                for tag in "${KNOWN_TAGS[@]}"; do
                  REPO_BASE="${DISTRO_PATH[$tag]}"
                  case "$arch" in
                    amd64) cp "$deb" "$REPO_BASE/amd64/$clean_name"; echo "  [$tag] amd64: $clean_name" ;;
                    arm64) cp "$deb" "$REPO_BASE/arm64/$clean_name"; echo "  [$tag] arm64: $clean_name" ;;
                    all)   cp "$deb" "$REPO_BASE/all/$clean_name";   echo "  [$tag] all: $clean_name" ;;
                  esac
                done
                continue
              fi

              REPO_BASE="${DISTRO_PATH[$distro_tag]}"
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "unknown")
              case "$arch" in
                amd64) cp "$deb" "$REPO_BASE/amd64/$clean_name"; echo "  [$distro_tag] amd64: $clean_name" ;;
                arm64) cp "$deb" "$REPO_BASE/arm64/$clean_name"; echo "  [$distro_tag] arm64: $clean_name" ;;
                all)
                  cp "$deb" "$REPO_BASE/amd64/$clean_name"
                  cp "$deb" "$REPO_BASE/arm64/$clean_name"
                  cp "$deb" "$REPO_BASE/all/$clean_name"
                  echo "  [$distro_tag] all: $clean_name"
                  ;;
                *) echo "  SKIP $name (unknown arch: $arch)" ;;
              esac
            done

            echo "::endgroup::"
          done

          # Handle source DEB files (.dsc, .orig.tar.*, .debian.tar.*)
          for tag in "${KNOWN_TAGS[@]}"; do
            base="${DISTRO_PATH[$tag]}"
            mkdir -p "$base/source"
          done

          for pkg_dir in /tmp/assets/*/; do
            pkg=$(basename "$pkg_dir")

            shopt -s nullglob
            src_files=("$pkg_dir"*.dsc "$pkg_dir"*.orig.tar.* "$pkg_dir"*.debian.tar.*)
            shopt -u nullglob
            [ ${#src_files[@]} -gt 0 ] || continue

            echo "::group::DEB source: $pkg"
            for src_file in "${src_files[@]}"; do
              name=$(basename "$src_file")

              distro_tag=""
              clean_name="$name"
              for tag in "${KNOWN_TAGS[@]}"; do
                if [[ "$name" == "${tag}."* ]]; then
                  distro_tag="$tag"
                  clean_name="${name#${tag}.}"
                  break
                fi
              done
              if [ -z "$distro_tag" ]; then
                distro_tag="ubuntu2404"
                clean_name="$name"
              fi

              REPO_BASE="${DISTRO_PATH[$distro_tag]}"
              cp "$src_file" "$REPO_BASE/source/$clean_name"
              echo "  [$distro_tag] source: $clean_name"
            done
            echo "::endgroup::"
          done

          # Rebuild APT indices for each distro
          echo "Rebuilding APT indices..."
          for tag in "${KNOWN_TAGS[@]}"; do
            REPO_BASE="${DISTRO_PATH[$tag]}"
            codename="${DISTRO_CODENAME[$tag]}"
            echo "  Distro: $tag ($codename)"

            # Remove old versions — keep only highest per package+arch
            for arch_dir in "$REPO_BASE"/amd64 "$REPO_BASE"/arm64 "$REPO_BASE"/all; do
              [ -d "$arch_dir" ] || continue
              # Group debs by package name, keep only newest
              ls "$arch_dir"/*.deb 2>/dev/null | sed 's/.*\///' | sed 's/^\([a-z]*\.\)\?//' | \
                sed 's/_[^_]*_[^_]*\.deb$//' | sort -u | while read pkg; do
                  count=$(ls "$arch_dir"/*"${pkg}"_*.deb 2>/dev/null | wc -l)
                  if [ "$count" -gt 1 ]; then
                    # Sort by version descending, remove all but first
                    ls -v "$arch_dir"/*"${pkg}"_*.deb | head -n -1 | while read old; do
                      echo "  Removing old: $(basename $old)"
                      rm -f "$old"
                    done
                  fi
                done
            done

            # Generate single root-level Packages index (flat repo format)
            (cd "$REPO_BASE" && dpkg-scanpackages --multiversion . /dev/null > Packages 2>/dev/null && gzip -9c Packages > Packages.gz)
            pkg_count=$(grep -c '^Package:' "$REPO_BASE/Packages" 2>/dev/null || echo 0)
            echo "    $pkg_count packages in root Packages index"

            # Generate Release file
            (
              cd "$REPO_BASE"
              {
                echo "Origin: xibo-players"
                echo "Label: Xibo Players"
                echo "Suite: ./"
                echo "Codename: $codename"
                echo "Date: $(date -Ru)"
                echo "MD5Sum:"
                for f in Packages Packages.gz; do
                  [ -f "$f" ] || continue
                  echo " $(md5sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
                done
                echo "SHA256:"
                for f in Packages Packages.gz; do
                  [ -f "$f" ] || continue
                  echo " $(sha256sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
                done
              } > Release
            )
          done

      - name: GPG-sign DEB Release files
        if: env.DEB_GPG_KEY != ''
        env:
          DEB_GPG_KEY: ${{ secrets.DEB_GPG_KEY }}
          DEB_GPG_PASSPHRASE: ${{ secrets.DEB_GPG_PASSPHRASE }}
        run: |
          # Configure GPG for non-interactive signing
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "${DEB_GPG_PASSPHRASE:-}" > /tmp/gpg-passphrase
          chmod 600 /tmp/gpg-passphrase
          echo "batch" > ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "passphrase-file /tmp/gpg-passphrase" >> ~/.gnupg/gpg.conf

          echo "$DEB_GPG_KEY" | base64 -d | gpg --batch --pinentry-mode loopback \
            --passphrase "${DEB_GPG_PASSPHRASE}" --import

          # Sign Release files for all distros
          for RELEASE_FILE in "deb/ubuntu/${UBUNTU_VER}/Release" "deb/debian/${DEBIAN_VER}/Release"; do
            if [ ! -f "$RELEASE_FILE" ]; then
              echo "No Release file at $RELEASE_FILE, skipping"
              continue
            fi

            rm -f "${RELEASE_FILE}.gpg" "$(dirname ${RELEASE_FILE})/InRelease"
            gpg --armor --detach-sign --output "${RELEASE_FILE}.gpg" "${RELEASE_FILE}"
            gpg --armor --clearsign --output "$(dirname ${RELEASE_FILE})/InRelease" "${RELEASE_FILE}"
            echo "Signed: $RELEASE_FILE"
          done

          rm -f /tmp/gpg-passphrase

      # ── Upload everything to Cloudflare R2 ───────────────────────────
      - name: Upload repositories to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${R2_BUCKET:-s3://xiboplayer-images}"

          # Upload DEB repos (packages + metadata)
          echo "=== Uploading DEB repositories ==="
          for suite in "deb/ubuntu/${UBUNTU_VER}" "deb/debian/${DEBIAN_VER}"; do
            [ -d "$suite" ] || continue
            echo "  $suite"
            aws s3 sync "$suite/" "$BUCKET/$suite/" \
              --endpoint-url "$R2_ENDPOINT" --delete --no-progress
          done

          # Upload DEB GPG key
          [ -f deb/GPG-KEY.asc ] && \
            aws s3 cp deb/GPG-KEY.asc "$BUCKET/deb/GPG-KEY.asc" --endpoint-url "$R2_ENDPOINT"

          # Upload RPM repos (packages + repodata)
          echo "=== Uploading RPM repositories ==="
          for v in $FEDORA_VERS; do
            for arch in x86_64 aarch64 noarch SRPMS; do
              dir="rpm/fedora/${v}/$arch"
              [ -d "$dir/repodata" ] || continue
              echo "  $dir"
              aws s3 sync "$dir/" "$BUCKET/$dir/" \
                --endpoint-url "$R2_ENDPOINT" --delete --no-progress
            done
          done

          # Upload RPM packages index (for website)
          [ -f rpm/packages.json ] && \
            aws s3 cp rpm/packages.json "$BUCKET/rpm/packages.json" \
              --endpoint-url "$R2_ENDPOINT" --content-type "application/json"

          # Upload RPM GPG key
          [ -f rpm/RPM-GPG-KEY ] && \
            aws s3 cp rpm/RPM-GPG-KEY "$BUCKET/rpm/RPM-GPG-KEY" --endpoint-url "$R2_ENDPOINT"

          # Upload RPM .repo file
          [ -f rpm/xibo-players.repo ] && \
            aws s3 cp rpm/xibo-players.repo "$BUCKET/rpm/xibo-players.repo" \
              --endpoint-url "$R2_ENDPOINT"

          # Upload static files
          for f in install-raspberry-pi.sh index.html; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "$BUCKET/$f" --endpoint-url "$R2_ENDPOINT"
          done

          echo ""
          echo "All repositories uploaded to R2:"
          echo "  DEB: https://dl.xiboplayer.org/deb/"
          echo "  RPM: https://dl.xiboplayer.org/rpm/"
