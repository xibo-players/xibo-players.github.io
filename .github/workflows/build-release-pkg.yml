name: Build xiboplayer-release packages

# Builds the xiboplayer-release RPM and DEB — the repo-config packages
# that users install to add the Xibo Players repository to their system.
#
# These packages ship a .repo/.sources file and GPG key, nothing else.
# Built packages are uploaded to a GitHub Release; update-repos.yml then
# fetches and indexes them alongside all other packages.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build RPM (fc${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [43, 44]
    container:
      image: fedora:${{ matrix.fedora }}

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install tools
        run: dnf install -y rpm-build rpmdevtools rpm-sign gnupg2 pinentry awscli2

      - name: Build RPM
        run: |
          rpmdev-setuptree
          cp _repos/xiboplayer-release/xiboplayer.repo ~/rpmbuild/SOURCES/
          cp _repos/xiboplayer-release/copr-keyd.repo ~/rpmbuild/SOURCES/
          cp rpm/RPM-GPG-KEY ~/rpmbuild/SOURCES/RPM-GPG-KEY-xiboplayer

          rpmbuild -bb _repos/xiboplayer-release/xiboplayer-release.spec \
            --define "_version ${{ matrix.fedora }}"

          mkdir -p dist/rpm
          cp ~/rpmbuild/RPMS/noarch/xiboplayer-release-*.noarch.rpm dist/rpm/
          echo "RPM:"
          ls -lh dist/rpm/

      - name: Sign RPM
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          # Secret stores raw ASCII armor — pipe directly, no base64.
          printf '%s\n' "$GPG_KEY" | gpg --batch --import

          # Derive fingerprint from imported key (single source of truth).
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}')

          printf '%s' "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
          chmod 600 /tmp/.gpg-passphrase
          cat > /usr/local/bin/pinentry-ci << 'PINENTRY'
          #!/bin/bash
          echo "OK Pleased to meet you"
          while IFS= read -r cmd; do
            case "${cmd%%\ *}" in
              GETPIN)
                echo "D $(cat /tmp/.gpg-passphrase)"
                echo "OK"
                ;;
              BYE)
                echo "OK"
                exit 0
                ;;
              *)
                echo "OK"
                ;;
            esac
          done
          PINENTRY
          chmod 755 /usr/local/bin/pinentry-ci

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-program /usr/local/bin/pinentry-ci" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

          echo "%_gpg_name ${GPG_KEY_ID}" >> ~/.rpmmacros

          for rpm_file in dist/rpm/*.rpm; do
            echo "Signing: $(basename $rpm_file)"
            rpm --addsign "$rpm_file"
          done

          rm -f /tmp/.gpg-passphrase

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${R2_BUCKET}"
          VER="${{ matrix.fedora }}"
          for rpm in dist/rpm/*.rpm; do
            [ -f "$rpm" ] || continue
            name=$(basename "$rpm")
            for arch in x86_64 aarch64 noarch; do
              echo "  $name → rpm/fedora/$VER/$arch/"
              aws s3 cp "$rpm" "$BUCKET/rpm/fedora/$VER/$arch/$name" --endpoint-url "$R2_ENDPOINT"
            done
          done

  build-deb:
    name: Build DEB
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install tools
        run: dnf install -y dpkg dpkg-dev awscli2

      - name: Build DEB
        run: |
          cd _repos/xiboplayer-release
          bash build-deb.sh
          mkdir -p ../../dist
          cp *.deb ../../dist/
          cd ../..
          echo "DEB:"
          ls -lh dist/*.deb

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${R2_BUCKET}"
          for deb in dist/*.deb; do
            [ -f "$deb" ] || continue
            name=$(basename "$deb")
            for suite in deb/ubuntu/24.04 deb/debian/trixie; do
              for arch in amd64 arm64; do
                echo "  $name → $suite/$arch/"
                aws s3 cp "$deb" "$BUCKET/$suite/$arch/$name" --endpoint-url "$R2_ENDPOINT"
              done
            done
          done

  trigger-update:
    name: Trigger repository update
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-repos
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/xiboplayer/xiboplayer.github.io/dispatches" \
            -d '{"event_type": "update-repos", "client_payload": {"package": "xiboplayer-release"}}'
          echo "Triggered update-repos for xiboplayer-release"
