name: Build xiboplayer-release packages

# Builds the xiboplayer-release RPM and DEB — the repo-config packages
# that users install to add the Xibo Players repository to their system.
#
# These packages ship a .repo/.sources file and GPG key, nothing else.
# Built packages are uploaded to a GitHub Release; update-repos.yml then
# fetches and indexes them alongside all other packages.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RPM + DEB
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v6

      - name: Install tools
        run: dnf install -y rpm-build rpmdevtools dpkg dpkg-dev rpm-sign gnupg2 pinentry

      - name: Build RPM
        run: |
          rpmdev-setuptree

          # Copy sources
          cp _repos/xiboplayer-release/xiboplayer.repo ~/rpmbuild/SOURCES/
          cp _repos/xiboplayer-release/copr-keyd.repo ~/rpmbuild/SOURCES/
          cp rpm/RPM-GPG-KEY ~/rpmbuild/SOURCES/RPM-GPG-KEY-xiboplayer

          # Build for supported Fedora versions
          for ver in 43 44; do
            echo "Building for Fedora $ver..."
            rpmbuild -bb _repos/xiboplayer-release/xiboplayer-release.spec \
              --define "_version ${ver}"
          done

          # RPMs now have .fc43/.fc44 in filename from %{?dist}
          # Upload directly to final repo paths
          mkdir -p dist/rpm
          for rpm in ~/rpmbuild/RPMS/noarch/xiboplayer-release-*.noarch.rpm; do
            [ -f "$rpm" ] || continue
            cp "$rpm" "dist/rpm/"
          done
          echo "RPMs:"
          ls -lh dist/rpm/

      - name: Build DEB
        run: |
          cd _repos/xiboplayer-release
          bash build-deb.sh
          cp *.deb ../../dist/
          cd ../..
          echo "DEB:"
          ls -lh dist/*.deb

      - name: Sign RPM
        env:
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          # Import GPG private key (base64-encoded secret)
          echo "$GPG_KEY" | base64 -d | gpg --batch --import

          # Custom pinentry for non-interactive signing in CI
          printf '%s' "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
          chmod 600 /tmp/.gpg-passphrase
          cat > /usr/local/bin/pinentry-ci << 'PINENTRY'
          #!/bin/bash
          echo "OK Pleased to meet you"
          while IFS= read -r cmd; do
            case "${cmd%%\ *}" in
              GETPIN)
                echo "D $(cat /tmp/.gpg-passphrase)"
                echo "OK"
                ;;
              BYE)
                echo "OK"
                exit 0
                ;;
              *)
                echo "OK"
                ;;
            esac
          done
          PINENTRY
          chmod 755 /usr/local/bin/pinentry-ci

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-program /usr/local/bin/pinentry-ci" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

          echo "%_gpg_name ${GPG_KEY_ID}" >> ~/.rpmmacros

          for rpm_file in dist/rpm/*.rpm; do
            echo "Signing: $(basename $rpm_file)"
            rpm --addsign "$rpm_file"
          done

          rm -f /tmp/.gpg-passphrase

          echo "Verifying signatures..."
          rpm -qpi dist/rpm/*.rpm | grep -E "^(Name|Signature)" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            Repository configuration package for Xibo Players.

            Install with:
            ```
            sudo dnf install ./xiboplayer-release-*.noarch.rpm
            ```

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          dnf install -y awscli2
          BUCKET="${R2_BUCKET}"

          # Upload RPMs to final repo paths (parse fc version from filename)
          for rpm in dist/rpm/*.rpm; do
            [ -f "$rpm" ] || continue
            name=$(basename "$rpm")
            # Extract Fedora version from .fc43. or .fc44. in filename
            ver=$(echo "$name" | grep -oP '\.fc\K[0-9]+')
            [ -z "$ver" ] && echo "  SKIP (no fc tag): $name" && continue
            for arch in x86_64 aarch64 noarch; do
              echo "  $name → rpm/fedora/$ver/$arch/"
              aws s3 cp "$rpm" "$BUCKET/rpm/fedora/$ver/$arch/$name" --endpoint-url "$R2_ENDPOINT"
            done
          done

          # Upload DEBs directly to final repo paths
          for deb in dist/*.deb; do
            [ -f "$deb" ] || continue
            name=$(basename "$deb")
            for suite in deb/ubuntu/24.04 deb/debian/trixie; do
              for arch in amd64 arm64; do
                echo "  $name → $suite/$arch/"
                aws s3 cp "$deb" "$BUCKET/$suite/$arch/$name" --endpoint-url "$R2_ENDPOINT"
              done
            done
          done

      - name: Trigger update-repos
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/xibo-players/xibo-players.github.io/dispatches" \
            -d '{"event_type": "update-repos", "client_payload": {"package": "xiboplayer-release"}}'
          echo "Triggered update-repos for xiboplayer-release"
